robot:
  name: "LiteArm-A10-Arms"
  max_torque: 15.0

# ── 端口 → 电机 全局ID 映射 ──
# /dev/ttyACM0 → 全局ID 1-8   (左臂: 7关节 + 夹爪)
# /dev/ttyACM1 → 全局ID 9-16  (右臂: 7关节 + 夹爪)

groups:

  left:
    name: "左臂"
    joint_names:
      - "l_joint1_joint"
      - "l_joint2_joint"
      - "l_joint3_joint"
      - "l_joint4_joint"
      - "l_joint5_joint"
      - "l_joint6_joint"
      - "l_joint7_joint"
      - "l_gripper_joint"
    motor_indices: [1, 2, 3, 4, 5, 6, 7, 8]
    joint_limits:
      lower: [-3.0543, -2.8623, -1.5708, -2.4435, -1.5708, -0.76794, -1.5708, 0.0]
      upper: [1.6581, 0.27925, 1.5708, 1.5708, 1.5708, 0.76794, 1.5708, 1.8]
    gripper_index: 7   # index within this group's joint_names that is the gripper
    end_effector_link: "l_joint7_link"

  right:
    name: "右臂"
    joint_names:
      - "r_joint1_joint"
      - "r_joint2_joint"
      - "r_joint3_joint"
      - "r_joint4_joint"
      - "r_joint5_joint"
      - "r_joint6_joint"
      - "r_joint7_joint"
      - "r_gripper_joint"
    motor_indices: [9, 10, 11, 12, 13, 14, 15, 16]
    joint_limits:
      lower: [-1.6581, -0.27925, -1.5708, -1.5708, -2.5, -0.76794, -1.5708, 0.0]
      upper: [3.0543, 2.8623, 1.5708, 2.4435, 2.5, 0.76794, 1.5708, 1.8]
    gripper_index: 7
    end_effector_link: "r_joint7_link"

# ── 串口到本地电机ID映射 (传给 MultiMotorManager) ──
ports:
  "/dev/ttyACM0": [1, 2, 3, 4, 5, 6, 7, 8]
  "/dev/ttyACM1": [1, 2, 3, 4, 5, 6, 7, 8]

# Python 上位机打开串口前会像 C++ 驱动一样扫描 /dev/ttyACM*。
# 如果 ACM0/ACM1 被系统枚举成 ACM2/ACM3，会按数字顺序自动映射。
serial:
  auto_resolve: true
  wait_timeout: 5.0
  wait_interval: 0.2

# 与 litearm_left/right_arm_motors.yaml 中的 C++ 电机类型保持一致。
motor_types:
  "/dev/ttyACM0": ["7256_35", "7256_35", "6056_36", "6056_36", "4438_30", "5047_36", "4438_30", "4438_30"]
  "/dev/ttyACM1": ["7256_35", "7256_35", "6056_36", "6056_36", "4438_30", "5047_36", "4438_30", "4438_30"]

# ── URDF / FK ──
urdf:
  file_path: "../../src/litearm_a10_251125/urdf/LiteArm_A10_251125.urdf"
  left_arm: "../../src/litearm_robot/urdf/LiteArm_A10_251224_left_arm.urdf"
  right_arm: "../../src/litearm_robot/urdf/LiteArm_A10_251224_right_arm.urdf"

# ── 控制参数 ──
control:
  default_velocity: 0.5
  loop_hz: 100
  gravity_loop_hz: 200
  impedance_loop_hz: 200
  broadcast_hz: 30
  home_timeout: 3.0
  state_wait_after_request: 0.002
  feedback_max_bad_samples: 5

# 关节空间阻抗控制：
# tau = G(q) + Kp * (q_target - q) - Kd * dq
# 下面每组 8 个参数按左/右臂电机的本地顺序复用，最后一个为夹爪。
impedance:
  kp: [6.0, 12.0, 12.0, 4.5, 3.0, 1.5, 1.2, 0.0]
  kd: [0.9, 1.2, 1.2, 0.6, 0.375, 0.225, 0.15, 0.0]
  torque_limit: [15.0, 25.0, 25.0, 15.0, 6.0, 6.0, 4.0, 2.0]
