robot:
  name: "LiteArm-A10-LeftArm-Follower"
  param_file: "litearm_left_arm_follower_motors.yaml"

# 遥操从臂目标直接映射主臂位置；限位与 URDF 关节行程保持一致。
joint_limits:
  lower: [-3.0543, -2.8623, -1.5708, -2.4435, -1.5708, -0.76794, -1.5708]
  upper: [1.6581, 0.27925, 1.5708, 1.5708, 1.5708, 0.76794, 1.5708]

urdf:
  file_path: "LiteArm_A10_251125.urdf"
  base_link: "base_link"
  end_effector_link: "l_joint7_link"

kinematics:
  joint_names:
    - "l_joint1_joint"
    - "l_joint2_joint"
    - "l_joint3_joint"
    - "l_joint4_joint"
    - "l_joint5_joint"
    - "l_joint6_joint"
    - "l_joint7_joint"

control:
  default_velocity: 0.5
  default_max_torque: 10.0
  position_tolerance: 0.01
  timeout: 10.0
